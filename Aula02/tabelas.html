<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
</head>
<body>

    <h1>Elementos das Tabelas</h1>
    <p>As tabelas em html são usadas para organizar dados em linhas e colunas.</p>

    <table border="1">
        <thead>
            <tr>
                <th>Nome</th>
                <th>Idade</th>
                <th>Cidade</th>
            </tr>
        </thead>
        <tbody border="1">
            <tr>
                <td>João</td>
                <td>25</td>
                <td>São Paulo</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
