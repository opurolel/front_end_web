<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anatomia das tags HTML</title>
</head>
<body>
    <h1>Anatomia das Tags</h1>
    <p>
        As tags HTML são os elementos básicos que compõem uma página web. Cada tag tem uma estrutura específica que desempenha um papel importante na organização e apresentação do conteúdo.
    </p>
    <p>Este é um exemplo de parágrafo que pode conter <strong>texto em negrito</strong> ou <em>texto em itálico.</em></p>
</body>
</html>
