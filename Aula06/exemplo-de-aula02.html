<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudando Classes em CSS</title>
    <style>
        body {
            background-color: rgb(254, 235, 255);
        }

        .titulo {
            color: rebeccapurple;
            text-align: center;
        }
        .caixa01 {
            background-color: rgb(242, 203, 245);
            border: 2px solid rebeccapurple;
            padding: 20px;
            margin: 20px;
        }

        /*Eu que quis deixar a mesma cor professor, achei que ficou mais legal assim :D*/
        .caixa02 {
            background-color: rgb(242, 203, 245);
            border: 2px solid rebeccapurple;
            padding: 20px;
            margin: 20px;
        }
        .paragrafo1 {
            color: rgb(59, 7, 27);
            font-weight: bold;
        }
        .paragrafo2 {
            color: rgb(255, 187, 240);
            background-color: rebeccapurple;
            font-style: oblique;
            padding: 10px;
            border-radius: 12px;
        }

    </style>
</head>
<body>

    <h1 class="titulo">Aprendendo Classes em CSS</h1>

    <div class="caixa01">
        <p class="paragrafo1">Este é o primeiro parágrafo.</p>
        <p class="paragrafo2">Este é o segundo parágrafo.</p>
    </div>

    <div class="caixa02">
        <p>Este é o único parágrafo da segunda div.</p>
    </div>

</body>
</html>
